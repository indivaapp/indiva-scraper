name: Trendyol Scraper

on:
  # Her 4 saatte bir otomatik (UTC)
  schedule:
    - cron: '0 */4 * * *'
  # Panelden manuel tetikleme
  workflow_dispatch:

# Aynı anda tek çalışma
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    # PC'deki self-hosted runner — Trendyol Cloudflare'i ev IP'sinde geçer
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scrape.js
